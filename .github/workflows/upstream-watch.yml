name: upstream-watch
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream release with tested branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/ilyamiro/serpantinum/releases/latest --jq .tag_name | sed 's/^v//')
          source compat.conf
          case "$latest" in
            "$TESTED_UPSTREAM"|"$TESTED_UPSTREAM".*) echo "up to date: $latest"; exit 0 ;;
          esac
          title="Upstream $latest is newer than tested $TESTED_UPSTREAM.x"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[]')" ]; then
            gh issue create --title "$title" --body "Проверьте оверлей на новом релизе апстрима и обновите compat.conf."
          fi
